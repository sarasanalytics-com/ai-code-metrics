# GitHub Actions workflow for AI Code Metrics collection.
#
# Copy this file to each tracked repo at: .github/workflows/ai-metrics.yml
#
# Runs on merge to dev only (code is counted once when it enters,
# not re-counted on qa/prod promotions). Classifies using
# Co-Authored-By trailers (tamper-resistant — baked into commit SHA).

name: AI Code Metrics

on:
  push:
    branches: [dev]

jobs:
  collect-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for commit range

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download collector script
        run: |
          curl -sL \
            -H "Authorization: token ${{ secrets.METRICS_PAT }}" \
            -o collect_on_merge.py \
            "https://raw.githubusercontent.com/${{ github.repository_owner }}/ai-code-metrics/main/ci/collect_on_merge.py"

      - name: Collect metrics
        id: metrics
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          OUTPUT_FILE: metrics_output.json
        run: python collect_on_merge.py

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-metrics-${{ github.sha }}
          path: metrics_output.json
          retention-days: 90

