# AI Code Metrics Configuration

# Repositories to track
repos:
  - name: iq-webapp
    path: /Users/venkat/Work/iq-webapp
  - name: webapp
    path: /Users/venkat/Work/webapp
  - name: global-accounts-webapp
    path: /Users/venkat/Work/global-accounts-webapp
  - name: insights-webapp
    path: /Users/venkat/Work/insights-webapp
  - name: saras-design-system
    path: /Users/venkat/Work/saras-design-system
  # Add more repos here:
  # - name: repo-name
  #   path: /path/to/repo

# PostgreSQL connection
database:
  host: localhost
  port: 5432
  name: ai_code_metrics
  user: metrics
  password: metrics

# Collection settings
collection:
  # How many days back to collect on each run (for catching up)
  lookback_days: 7
  # Branch to analyze
  default_branch: main

# Half-life analysis
halflife:
  # How often to run (managed by cron, this is for reference)
  schedule: weekly
  # Minimum cohort size (lines) to include in analysis
  min_cohort_size: 50

# AI tool detection patterns
detection:
  # Co-Authored-By patterns (case-insensitive substring match)
  co_authored_by:
    claude:
      - "Claude"
      - "claude"
      - "anthropic"
    windsurf:
      - "Windsurf"
      - "windsurf"
      - "Codeium"

  # Commit message patterns (regex)
  commit_message:
    windsurf:
      - "Generated by Windsurf"
      - "\\[Windsurf\\]"
    cursor:
      - "Generated by Cursor"

  # Author email patterns
  author_email:
    # Example: if your team configures AI tools to use specific emails
    # claude:
    #   - "claude-bot@yourcompany.com"

# GitHub API settings (for PR token efficiency metrics)
github:
  org: sarasanalytics-com
  token_env: SARAS_UI_TEAM_ACCESS_TOKEN  # read from env var, not stored in config

# Sentry settings (for incident correlation)
sentry:
  org: sarasanalytics
  token_env: SENTRY_AUTH_TOKEN  # read from env var
  projects:
    - slug: iq-webapp
      repo: iq-webapp
    # Add more projects:
    # - slug: webapp
    #   repo: webapp

# AI spend estimation
spend:
  estimation:
    claude:
      tokens_per_line: 50
      input_output_ratio: 3  # 3 input tokens per 1 output token
      input_price_per_m: 3.00   # $/M tokens (Sonnet)
      output_price_per_m: 15.00
    windsurf:
      monthly_per_seat: 15.00  # flat rate, divide by active days
    # When org admin API becomes available, switch to 'api' source:
    # anthropic_admin_key_env: ANTHROPIC_ADMIN_KEY
