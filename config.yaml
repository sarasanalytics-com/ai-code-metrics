# AI Code Metrics Configuration

# Repositories to track
repos:
  - name: iq-webapp
    path: /Users/venkat/Work/iq-webapp
  - name: webapp
    path: /Users/venkat/Work/webapp
  - name: global-accounts-webapp
    path: /Users/venkat/Work/global-accounts-webapp
  - name: insights-webapp
    path: /Users/venkat/Work/insights-webapp
  - name: saras-design-system
    path: /Users/venkat/Work/saras-design-system
  # Add more repos here:
  # - name: repo-name
  #   path: /path/to/repo

# PostgreSQL connection
database:
  host: localhost
  port: 5432
  name: ai_code_metrics
  user: metrics
  password: metrics

# Collection settings
collection:
  # How many days back to collect on each run (for catching up)
  lookback_days: 7
  # Branch to analyze
  default_branch: main

# Half-life analysis
halflife:
  # How often to run (managed by cron, this is for reference)
  schedule: weekly
  # Minimum cohort size (lines) to include in analysis
  min_cohort_size: 50

# AI tool detection patterns
detection:
  # Co-Authored-By patterns (case-insensitive substring match)
  co_authored_by:
    claude:
      - "Claude"
      - "claude"
      - "anthropic"
    windsurf:
      - "Windsurf"
      - "windsurf"
      - "Codeium"
    cursor:
      - "Cursor"
      - "cursor"
    copilot:
      - "Copilot"
      - "copilot"
    junie:
      - "Junie"
      - "junie"
      - "jetbrains"
      - "JetBrains"
    gemini:
      - "Gemini"
      - "gemini"
      - "google"
      - "Google"

  # Commit message patterns (regex)
  commit_message:
    windsurf:
      - "Generated by Windsurf"
      - "\\[Windsurf\\]"
    cursor:
      - "Generated by Cursor"
    junie:
      - "Generated by Junie"
      - "\\[Junie\\]"
    gemini:
      - "Generated by Gemini"
      - "\\[Gemini\\]"

  # Author email patterns
  author_email:
    # Example: if your team configures AI tools to use specific emails
    # claude:
    #   - "claude-bot@yourcompany.com"
