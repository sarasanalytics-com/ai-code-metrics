# Reusable workflow for AI Code Metrics collection.
#
# Call from any repo's workflow:
#
#   collect-metrics:
#     if: github.ref == 'refs/heads/dev'
#     uses: sarasanalytics-com/ai-code-metrics/.github/workflows/collect-metrics.yml@dev
#     with:
#       base_sha: ${{ github.event.before }}
#       head_sha: ${{ github.sha }}

name: AI Code Metrics

on:
  workflow_call:
    inputs:
      base_sha:
        description: "Base commit SHA (before merge)"
        required: true
        type: string
      head_sha:
        description: "Head commit SHA (after merge)"
        required: true
        type: string
   
      
        

permissions:
  contents: read



jobs:
  collect-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch git-ai notes
        run: git fetch origin refs/notes/ai:refs/notes/ai 2>/dev/null || true

      - name: Install git-ai
        run: curl -sSL https://usegitai.com/install.sh | bash 2>/dev/null || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download collector script
        run: |
          curl -sfL \
            -o collect_on_merge.py \
            "https://raw.githubusercontent.com/sarasanalytics-com/ai-code-metrics/dev/ci/collect_on_merge.py"

      - name: Collect metrics
        id: metrics
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          OUTPUT_FILE: metrics_output.json
        run: python collect_on_merge.py

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-metrics-${{ inputs.head_sha }}
          path: metrics_output.json
          retention-days: 90

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Download Cloud SQL Auth Proxy
        run: |
          curl -sfL \
            -o cloud-sql-proxy \
            "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.11.0/cloud-sql-proxy.linux.amd64"
          chmod +x cloud-sql-proxy

      - name: Start Cloud SQL Auth Proxy
        run: |
          ./cloud-sql-proxy \
            --port 5432 \
            ${{ secrets.CLOUD_SQL_CONNECTION_NAME }} &
          # Wait until the proxy is ready to accept connections
          echo "Waiting for Cloud SQL Proxy to be ready..."
          for i in $(seq 1 15); do
            if nc -z 127.0.0.1 5432; then
              echo "Proxy is ready."
              break
            fi
            sleep 1
          done

      - name: Download push-to-cloudsql script
        run: |
          curl -sfL \
            -o push_to_cloudsql.py \
            "https://raw.githubusercontent.com/sarasanalytics-com/ai-code-metrics/dev/ci/push_to_cloudsql.py"

      - name: Push metrics to Cloud SQL
        env:
          METRICS_FILE: metrics_output.json
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: python push_to_cloudsql.py
